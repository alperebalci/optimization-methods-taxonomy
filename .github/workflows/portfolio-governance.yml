name: Portfolio Governance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline portfolio inventory tests
        run: python -m unittest discover -s tests -p 'test_portfolio_inventory.py'
      - name: Check registry and catalog inventory
        run: python scripts/portfolio_governance.py --inventory-only
      - name: Check generated portfolio index
        run: python scripts/render_portfolio_index.py --check
      - name: Validate portfolio governance
        run: python scripts/portfolio_governance.py
